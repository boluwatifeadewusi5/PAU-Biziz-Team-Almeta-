<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PAU biziz</title>
    <script>
      ;(function () {
        const path = window.location.pathname.replace(/\/+$/, '')
        const query = window.location.search.replace(/^\?/, '')
        const hash = window.location.hash
        const redirect = `${window.location.origin}/PAU-Biziz-Team-Almeta-/?p=${encodeURIComponent(path)}${
          query ? `&q=${encodeURIComponent(query)}` : ''
        }${hash}`
        window.location.replace(redirect)
      })()
    </script>
  </head>
  <body></body>
</html>
