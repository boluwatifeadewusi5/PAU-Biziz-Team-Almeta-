<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#082b43" />
    <meta
      name="description"
      content="Discover products, services, and the people building businesses at PAU."
    />
    <title>PAU biziz · Same campus. More possibilities.</title>
    <script>
      ;(function () {
        const search = window.location.search
        if (!search.startsWith('?p=')) return

        const path = decodeURIComponent(search.slice(3))
        const query = window.location.search.includes('&q=')
          ? decodeURIComponent(window.location.search.split('&q=')[1])
          : ''
        const hash = window.location.hash || ''
        const nextUrl = path + (query ? `?${query}` : '') + hash
        window.history.replaceState(null, '', nextUrl)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
